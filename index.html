<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management Frontend</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .hidden { display: none; }
        #employee-list { margin-top: 20px; }
        .employee-card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Admin Login</h2>
    <div id="login-section">
        <input type="email" id="email" placeholder="Email" value="alice2@test.com">
        <input type="password" id="password" placeholder="Password" value="password123">
        <button onclick="login()">Login</button>
    </div>

    <div id="dashboard" class="hidden">
        <h2>Employee Directory</h2>
        <button onclick="loadEmployees()">Refresh Employees</button>
        <button onclick="loadStats()">Show Department Stats</button>
        
        <div id="stats-container"></div>
        <div id="employee-list"></div>
    </div>

    <script>
        let token = "";

        // 1. Login Function
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const response = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            
            if (response.ok) {
                token = data.token;
                alert('Login successful!');
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadEmployees(); // Automatically load data
            } else {
                alert('Login failed: ' + data.message);
            }
        }

        // 2. Load Employees
        async function loadEmployees() {
            const response = await fetch('http://localhost:3000/api/employees');
            const employees = await response.json();
            
            const list = document.getElementById('employee-list');
            list.innerHTML = "<h3>Employees</h3>";
            
            employees.forEach(emp => {
                const deptName = emp.department ? emp.department.name : 'No Department';
                list.innerHTML += `
                    <div class="employee-card">
                        <strong>${emp.firstName} ${emp.lastName}</strong><br>
                        Email: ${emp.email}<br>
                        Role: ${emp.role}<br>
                        Department: ${deptName}
                    </div>
                `;
            });
        }

        // 3. Load Aggregation Stats
        async function loadStats() {
            const response = await fetch('http://localhost:3000/api/employees/stats');
            const stats = await response.json();
            
            const container = document.getElementById('stats-container');
            container.innerHTML = "<h3>Department Stats (Aggregation)</h3>";
            
            stats.forEach(stat => {
                const name = stat.departmentName || "Unknown Dept";
                container.innerHTML += `<p><strong>${name}:</b> ${stat.totalEmployees} employees</p>`;
            });
        }
    </script>
</body>
</html>
